<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nexus browser functional fixture</title>
<style>
body{margin:0;background:#0b1220;color:#e5e7eb;font:16px system-ui}main{max-width:900px;margin:auto;padding:24px}h1{font-size:26px}p{color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#172238;border:1px solid #334155;border-radius:14px;padding:18px}label{display:block;margin:8px 0}input,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #64748b}input{width:90%;box-sizing:border-box}button{background:#22d3ee;color:#0b1220;margin:8px 0;cursor:pointer}canvas{background:#0f172a;max-width:100%;border:1px solid #475569;border-radius:8px}.pill{display:inline-block;background:#065f46;padding:4px 10px;border-radius:20px}[hidden]{display:none}@media(max-width:500px){main{padding:16px}.grid{grid-template-columns:1fr}h1{font-size:23px}}
</style></head><body><main><span class="pill">Isolated fixture</span><h1>Nexus browser regression</h1><p>Real Nexus preload · controlled local page · no provider login</p><div class="grid"><section class="card"><h2>Frontend interaction</h2><label for="name">Name</label><input id="name" autocomplete="off"><button id="save">Save profile</button><p id="status" role="status">Waiting for input</p><button id="menu-toggle" aria-expanded="false">Open menu</button><div id="menu" role="menu" hidden>Menu is open</div></section><section class="card"><h2>Canvas key controls</h2><p>Controls use KeyboardEvent.code (W / ArrowRight).</p><button id="start">Start game</button><button id="restart">Restart game</button><canvas id="game" width="300" height="180" aria-label="Local game"></canvas><p id="game-status" role="status">Game stopped</p><p id="held-status">Held frame movement: 0</p></section></div></main>
<script>
const fixture={moves:0,x:40,heldFrames:0,events:[],saved:false,started:false};window.__fixture=fixture;
const ctx=document.querySelector('#game').getContext('2d');const held=new Set();
function draw(){ctx.fillStyle='#0f172a';ctx.fillRect(0,0,300,180);ctx.strokeStyle='#334155';for(let x=0;x<300;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,180);ctx.stroke()}ctx.fillStyle='#22d3ee';ctx.fillRect(fixture.x,75,24,24);ctx.fillStyle='#cbd5e1';ctx.font='14px system-ui';ctx.fillText('Position '+fixture.x,12,24)}draw();
function start(){held.clear();fixture.started=true;fixture.moves=0;fixture.x=40;fixture.heldFrames=0;document.querySelector('#game-status').textContent='Movement: 0';document.querySelector('#held-status').textContent='Held frame movement: 0';draw()}
document.querySelector('#start').addEventListener('click',start);document.querySelector('#restart').addEventListener('click',start);
document.addEventListener('keydown',e=>{fixture.events.push({type:e.type,key:e.key,code:e.code,isTrusted:e.isTrusted});if(!fixture.started)return;held.add(e.code);if(['KeyW','ArrowRight'].includes(e.code)){fixture.moves++;fixture.x+=20;document.querySelector('#game-status').textContent='Movement: '+fixture.moves;draw()}});document.addEventListener('keyup',e=>{fixture.events.push({type:e.type,key:e.key,code:e.code,isTrusted:e.isTrusted});held.delete(e.code)});
function frame(){if(fixture.started&&held.has('ArrowRight')){fixture.heldFrames++;fixture.x++;document.querySelector('#held-status').textContent='Held frame movement: '+fixture.heldFrames;draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelector('#save').addEventListener('click',()=>{fixture.saved=true;document.querySelector('#status').textContent='Saved '+document.querySelector('#name').value});document.querySelector('#menu-toggle').addEventListener('click',e=>{document.querySelector('#menu').hidden=!document.querySelector('#menu').hidden;e.target.setAttribute('aria-expanded',String(!document.querySelector('#menu').hidden))});console.error('fixture expected console capture');
</script></body></html>
