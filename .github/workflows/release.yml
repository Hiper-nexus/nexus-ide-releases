name: Release macOS + Linux/Windows preview gates

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag semântica existente a publicar (ex.: v0.12.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  validate:
    name: Validar fonte da release
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Validar tag, commit, versões e notas
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::tag inválida: $RELEASE_TAG"
            exit 1
          }
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          test "$HEAD_COMMIT" = "$TAG_COMMIT" || {
            echo "::error::checkout $HEAD_COMMIT não corresponde à tag $RELEASE_TAG ($TAG_COMMIT)"
            exit 1
          }

          VERSION="$(node -p "require('./package.json').version")"
          SERVER_VERSION="$(node -p "require('./server/package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION" || {
            echo "::error::tag $RELEASE_TAG não corresponde a package.json v$VERSION"
            exit 1
          }
          test "$SERVER_VERSION" = "$VERSION" || {
            echo "::error::server $SERVER_VERSION diverge do app $VERSION"
            exit 1
          }
          grep -F "version: '$VERSION'" src/shared/release-notes.ts >/dev/null || {
            echo "::error::CURRENT_RELEASE não corresponde a $VERSION"
            exit 1
          }
          grep -F "## $VERSION " CHANGELOG.md >/dev/null || {
            echo "::error::CHANGELOG sem seção $VERSION"
            exit 1
          }
          printf 'commit_sha=%s\nrelease_tag=%s\nversion=%s\n' \
            "$HEAD_COMMIT" "$RELEASE_TAG" "$VERSION" >>"$GITHUB_OUTPUT"

  quality:
    name: Gate de qualidade e segurança
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Instalar a dependência de sandbox Linux
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          bwrap --version
          # GitHub-hosted Ubuntu blocks the user namespaces Bubblewrap needs.
          # Capability execution is therefore a real-machine release gate;
          # this runner proves dependency/package structure and unit plans.

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run typecheck --workspace @nexus/server
      - run: npm test --workspace @nexus/server
      - run: npm run verify:artifact --workspace @nexus/server
      - run: npm audit --audit-level=moderate

  build_macos:
    name: macOS ${{ matrix.arch }} · signed/notarized/runtime
    needs: [validate, quality]
    runs-on: ${{ matrix.runner }}
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    env:
      EXPECTED_SIGNING_IDENTITY: 'Developer ID Application: Cleofas Pereira rocha'
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Instalar e reconstruir nativos antes de carregar a chave
        run: |
          set -euo pipefail
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}" || {
            echo "::error::runner não corresponde à arquitetura ${{ matrix.arch }}"
            exit 1
          }
          npm ci
          npm run premake
          npx vitest run \
            build/macos-info-plist.test.ts \
            src/main/runtime/process-sandbox.test.ts
          npm sbom --sbom-format cyclonedx >"$RUNNER_TEMP/NexusIDE-$VERSION.full.cyclonedx.json"

      - name: Exigir credenciais completas de assinatura/notarização
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID \
            MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            test -n "${!name:-}" || missing+=("$name")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::release macOS bloqueada: secrets ausentes: ${missing[*]}"
            echo "::error::configure-os no environment macos-signing; artefato ad-hoc nunca é publicável"
            exit 1
          fi
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "::error::APPLE_TEAM_ID deve conter exatamente 10 letras maiúsculas/dígitos"
            exit 1
          }
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json >/dev/null

      - name: Importar certificado Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/devid.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode >"$CERT"
          chmod 600 "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          EXPECTED_AUTHORITY="$EXPECTED_SIGNING_IDENTITY ($APPLE_TEAM_ID)"
          MATCH_COUNT="$(grep -F -c "\"$EXPECTED_AUTHORITY\"" <<<"$IDENTITIES" || true)"
          test "$MATCH_COUNT" = 1 || {
            echo "::error::esperada uma identidade $EXPECTED_AUTHORITY; encontradas $MATCH_COUNT"
            exit 1
          }

      - name: Build, assinatura e notarização
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./node_modules/.bin/electron-forge make

      - name: Verificar os artefatos recebidos pelo usuário
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          node scripts/verify-macos-release.mjs \
            --artifacts out/make \
            --version "$VERSION" \
            --bundle-id com.nexuside.app \
            --team-id "$APPLE_TEAM_ID" \
            --identity "$EXPECTED_SIGNING_IDENTITY"

      - name: Remover chave do runner
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/devid.p12"

      - name: Preparar assets macOS verificáveis
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          DMG_COUNT="$(find out/make -type f -name '*.dmg' | wc -l | tr -d ' ')"
          ZIP_COUNT="$(find out/make -type f -name "*darwin-$ARCH*.zip" | wc -l | tr -d ' ')"
          test "$DMG_COUNT" = 1 || { echo "::error::esperado 1 DMG, achei $DMG_COUNT"; exit 1; }
          test "$ZIP_COUNT" = 1 || { echo "::error::esperado 1 ZIP $ARCH, achei $ZIP_COUNT"; exit 1; }
          DMG="$(find out/make -type f -name '*.dmg' -print -quit)"
          ZIP="$(find out/make -type f -name "*darwin-$ARCH*.zip" -print -quit)"
          ASSET_DIR=release-assets
          mkdir -p "$ASSET_DIR"
          cp "$DMG" "$ASSET_DIR/NexusIDE-$VERSION-darwin-$ARCH.dmg"
          cp "$ZIP" "$ASSET_DIR/NexusIDE-$VERSION-darwin-$ARCH.zip"
          cp "$RUNNER_TEMP/NexusIDE-$VERSION.full.cyclonedx.json" \
            "$ASSET_DIR/NexusIDE-$VERSION-darwin-$ARCH.full.cyclonedx.json"
          printf 'platform=darwin\narch=%s\ncommit=%s\nruntime_validation=passed\nruntime_target=dmg-and-zip-extracted\nsigning=developer-id\nnotarization=stapled\n' \
            "$ARCH" "$(git rev-parse HEAD)" \
            >"$ASSET_DIR/NexusIDE-$VERSION-darwin-$ARCH.smoke.txt"
          (
            cd "$ASSET_DIR"
            shasum -a 256 \
              "NexusIDE-$VERSION-darwin-$ARCH.dmg" \
              "NexusIDE-$VERSION-darwin-$ARCH.zip" \
              "NexusIDE-$VERSION-darwin-$ARCH.full.cyclonedx.json" \
              "NexusIDE-$VERSION-darwin-$ARCH.smoke.txt" \
              >"NexusIDE-$VERSION-darwin-$ARCH.sha256"
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-darwin-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build_linux:
    name: Linux x64 · runtime obrigatório (sandbox host documentado)
    needs: [validate, quality]
    # GitHub-hosted Ubuntu blocks the user namespace needed by Bubblewrap.
    # Keep the package/runtime smoke diagnostic, but never promote this job's
    # artifacts to a public production release without a real sandbox run.
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Instalar toolchain nativo Linux
        run: |
          set -euo pipefail
          test "$(node -p 'process.arch')" = x64
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap fakeroot rpm xvfb
          bwrap --version
          npm ci
          npm run premake

      - name: Build Linux no runner Linux
        run: ./node_modules/.bin/electron-forge make

      - name: Smoke real do DEB no runner Linux
        run: |
          set -euo pipefail
          mapfile -t DEBS < <(find out/make -type f -name '*.deb')
          test "${#DEBS[@]}" = 1 || {
            echo "::error::esperado 1 DEB para smoke, achei ${#DEBS[@]}"
            exit 1
          }
          EXTRACTED="$RUNNER_TEMP/nexus-deb"
          mkdir -p "$EXTRACTED"
          dpkg-deb --extract "${DEBS[0]}" "$EXTRACTED"
          mapfile -t BINARIES < <(find "$EXTRACTED" -type f -name NexusIDE -perm -111)
          test "${#BINARIES[@]}" = 1 || {
            echo "::error::esperado 1 executável NexusIDE no DEB, achei ${#BINARIES[@]}"
            exit 1
          }
          xvfb-run -a node scripts/smoke-packaged-app.mjs --app "${BINARIES[0]}"

      - name: Preparar assets Linux verificáveis
        run: |
          set -euo pipefail
          mapfile -t DEBS < <(find out/make -type f -name '*.deb')
          mapfile -t RPMS < <(find out/make -type f -name '*.rpm')
          test "${#DEBS[@]}" = 1 || { echo "::error::esperado 1 DEB, achei ${#DEBS[@]}"; exit 1; }
          test "${#RPMS[@]}" = 1 || { echo "::error::esperado 1 RPM, achei ${#RPMS[@]}"; exit 1; }
          test "$(dpkg-deb -f "${DEBS[0]}" Version)" = "$VERSION"
          test "$(dpkg-deb -f "${DEBS[0]}" Architecture)" = amd64
          test "$(rpm -qp --queryformat '%{VERSION}' "${RPMS[0]}")" = "$VERSION"
          test "$(rpm -qp --queryformat '%{ARCH}' "${RPMS[0]}")" = x86_64

          ASSET_DIR=release-assets
          mkdir -p "$ASSET_DIR"
          cp "${DEBS[0]}" "$ASSET_DIR/NexusIDE-$VERSION-linux-x64.deb"
          cp "${RPMS[0]}" "$ASSET_DIR/NexusIDE-$VERSION-linux-x64.rpm"
          npm sbom --sbom-format cyclonedx \
            >"$ASSET_DIR/NexusIDE-$VERSION-linux-x64.full.cyclonedx.json"
          printf 'platform=linux\narch=x64\ncommit=%s\npackaged_app_runtime_validation=passed\nruntime_target=deb-extracted\nsandbox_runtime_validation=not-run-host-userns-policy\nrpm_runtime_validation=not-run\nrunner_os=Linux\nchannel=ci-preview\nproduction_eligibility=blocked-sandbox-runtime-not-proven\n' \
            "$(git rev-parse HEAD)" \
            >"$ASSET_DIR/NexusIDE-$VERSION-linux-x64.smoke.txt"
          (
            cd "$ASSET_DIR"
            sha256sum \
              "NexusIDE-$VERSION-linux-x64.deb" \
              "NexusIDE-$VERSION-linux-x64.rpm" \
              "NexusIDE-$VERSION-linux-x64.full.cyclonedx.json" \
              "NexusIDE-$VERSION-linux-x64.smoke.txt" \
              >"NexusIDE-$VERSION-linux-x64.sha256"
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-assets-linux-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build_windows:
    name: Windows x64 · runtime obrigatório (unsigned preview)
    needs: [validate, quality]
    # Runtime/empacotamento precisam ser provados mesmo sem certificado. Este
    # artefato continua explicitamente não publicável; Authenticode pertence a
    # um gate de promoção separado e nunca pode esconder uma quebra Windows.
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Instalar e reconstruir nativos Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node -p 'process.arch') -ne 'x64') { throw 'runner Windows não é x64' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci falhou' }
          npm run premake
          if ($LASTEXITCODE -ne 0) { throw 'premake falhou' }

      - name: Build Windows no runner Windows
        shell: pwsh
        run: |
          & ./node_modules/.bin/electron-forge.cmd make
          if ($LASTEXITCODE -ne 0) { throw 'electron-forge make falhou' }

      - name: Smoke real do NUPKG no runner Windows
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem out/make -Recurse -File -Filter '*-full.nupkg')
          if ($packages.Count -ne 1) { throw "esperado 1 full.nupkg para smoke, achei $($packages.Count)" }
          $archive = Join-Path $env:RUNNER_TEMP 'NexusIDE-full.zip'
          $extracted = Join-Path $env:RUNNER_TEMP 'NexusIDE-nupkg'
          Copy-Item $packages[0].FullName $archive
          Expand-Archive -Path $archive -DestinationPath $extracted
          $binaries = @(Get-ChildItem $extracted -Recurse -File -Filter 'NexusIDE.exe')
          if ($binaries.Count -ne 1) { throw "esperado 1 NexusIDE.exe no NUPKG, achei $($binaries.Count)" }
          node scripts/smoke-packaged-app.mjs --app $binaries[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'smoke Windows falhou' }

      - name: Preparar assets Windows verificáveis
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem out/make -Recurse -File -Filter '*Setup.exe')
          $packages = @(Get-ChildItem out/make -Recurse -File -Filter '*-full.nupkg')
          $releases = @(Get-ChildItem out/make -Recurse -File -Filter 'RELEASES')
          if ($setups.Count -ne 1) { throw "esperado 1 Setup.exe, achei $($setups.Count)" }
          if ($packages.Count -ne 1) { throw "esperado 1 full.nupkg, achei $($packages.Count)" }
          if ($releases.Count -ne 1) { throw "esperado 1 RELEASES, achei $($releases.Count)" }
          $extracted = Join-Path $env:RUNNER_TEMP 'NexusIDE-nupkg'
          $assets = 'release-assets'
          New-Item -ItemType Directory -Force $assets | Out-Null
          Copy-Item $setups[0].FullName "$assets/NexusIDE-${env:VERSION}-win32-x64-setup.exe"
          Copy-Item $packages[0].FullName "$assets/NexusIDE-${env:VERSION}-win32-x64-full.nupkg"
          Copy-Item $releases[0].FullName "$assets/NexusIDE-${env:VERSION}-win32-x64-RELEASES"
          npm sbom --sbom-format cyclonedx | Out-File \
            "$assets/NexusIDE-${env:VERSION}-win32-x64.full.cyclonedx.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'npm sbom falhou' }
          @(
            'platform=win32'
            'arch=x64'
            "commit=$(git rev-parse HEAD)"
            'runtime_validation=passed'
            'runtime_target=nupkg-extracted'
            'setup_runtime_validation=not-run'
            'runner_os=Windows'
            'signing=unsigned-preview'
            'channel=ci-preview'
            'production_eligibility=blocked-windows-sandbox'
          ) | Set-Content "$assets/NexusIDE-${env:VERSION}-win32-x64.smoke.txt" -Encoding utf8

          $checksummed = @(
            "NexusIDE-${env:VERSION}-win32-x64-setup.exe"
            "NexusIDE-${env:VERSION}-win32-x64-full.nupkg"
            "NexusIDE-${env:VERSION}-win32-x64-RELEASES"
            "NexusIDE-${env:VERSION}-win32-x64.full.cyclonedx.json"
            "NexusIDE-${env:VERSION}-win32-x64.smoke.txt"
          )
          $checksum = "$assets/NexusIDE-${env:VERSION}-win32-x64.sha256"
          $checksummed | ForEach-Object {
            $hash = (Get-FileHash "$assets/$_" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content $checksum -Encoding ascii

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-assets-win32-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publicar macOS após gates runtime macOS/Linux/Windows
    needs: [validate, build_macos, build_linux, build_windows]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    env:
      COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.release_tag }}

      - name: Revalidar que a tag não mudou durante os builds
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA" || {
            echo "::error::a tag $RELEASE_TAG mudou durante a execução; release bloqueada"
            exit 1
          }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-assets-darwin-*
          merge-multiple: true
          path: release-assets

      - name: Verificar contrato e checksums dos assets de produção
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR=release-assets
          expected=(
            "NexusIDE-$VERSION-darwin-arm64.dmg"
            "NexusIDE-$VERSION-darwin-arm64.zip"
            "NexusIDE-$VERSION-darwin-arm64.full.cyclonedx.json"
            "NexusIDE-$VERSION-darwin-arm64.smoke.txt"
            "NexusIDE-$VERSION-darwin-arm64.sha256"
            "NexusIDE-$VERSION-darwin-x64.dmg"
            "NexusIDE-$VERSION-darwin-x64.zip"
            "NexusIDE-$VERSION-darwin-x64.full.cyclonedx.json"
            "NexusIDE-$VERSION-darwin-x64.smoke.txt"
            "NexusIDE-$VERSION-darwin-x64.sha256"
          )
          for asset in "${expected[@]}"; do
            test -f "$ASSET_DIR/$asset" || {
              echo "::error::asset ausente: $asset"
              exit 1
            }
          done
          FILE_COUNT="$(find "$ASSET_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$FILE_COUNT" = "${#expected[@]}" || {
            echo "::error::esperados ${#expected[@]} assets, achei $FILE_COUNT"
            exit 1
          }
          (
            cd "$ASSET_DIR"
            for checksum in NexusIDE-"$VERSION"-*.sha256; do
              sha256sum --check "$checksum"
            done
          )

      - name: Criar release nova sem substituir artefatos existentes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## $VERSION " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md >"$RELEASE_NOTES"
          test -s "$RELEASE_NOTES" || {
            echo "::error::seção $VERSION do CHANGELOG está vazia"
            exit 1
          }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::release $RELEASE_TAG já existe; publique uma nova versão"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "NexusIDE $RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES" \
            release-assets/*
