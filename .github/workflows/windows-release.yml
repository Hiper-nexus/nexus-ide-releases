name: Windows x64 release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version on protected main (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-signing
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'Hiper-nexus/nexus-ide' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    # Máquina Windows do próprio GitHub, nova a cada build. O runner no PC do
    # operador só existia para o certificado do eSigner instalado nele; sem
    # assinatura, ele deixou de ser necessário (e estava offline desde 18/09).
    runs-on: windows-latest
    environment: windows-release-signing
    timeout-minutes: 90
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      RELEASE_VERSION: ${{ inputs.version }}
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Require protected main before executing repository code
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Hiper-nexus/nexus-ide' -or $env:GITHUB_REF -ne 'refs/heads/main') { throw 'unauthorized release source' }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'stable version required' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $branch = Invoke-RestMethod -Uri 'https://api.github.com/repos/Hiper-nexus/nexus-ide/branches/main' -Headers $headers
          if (-not $branch.protected -or $branch.commit.sha -ne $env:GITHUB_SHA) { throw 'release commit must be current protected main' }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm

      # node-gyp (better-sqlite3) needs a real Python interpreter during the
      # Electron rebuild. On windows-latest this resolves to the preinstalled
      # Python on PATH; the explicit candidates only matter on a local host.
      - name: Configure Python for native rebuild
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:USERPROFILE '.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Python\Python312\python.exe'),
            'C:\Python312\python.exe'
          )
          $python = $candidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $python) {
            $command = Get-Command python -ErrorAction SilentlyContinue
            if ($command) { $python = $command.Source }
          }
          if (-not $python) { throw 'Python 3.12 is required for the native Electron rebuild' }
          "PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_python=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python --version

      - name: Validate version, commit and optional existing release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'checkout commit mismatch' }
          if ((node -p "require('./package.json').version") -ne $env:RELEASE_VERSION) { throw 'version mismatch' }
          if ((node -p "require('./package.json').nexusRelease.node") -ne (node -p 'process.versions.node')) { throw 'Node release authority mismatch' }
          $tag = "refs/tags/v$env:RELEASE_VERSION"
          git show-ref --verify --quiet $tag
          if ($LASTEXITCODE -eq 0) {
            if ((git rev-parse "$tag^{}") -ne $env:GITHUB_SHA) { throw 'existing tag points at another commit' }
          }
          $global:LASTEXITCODE = 0

      - name: Install and verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          ./scripts/install-windows-smoke-codex.ps1
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'typecheck failed' }
          npm run security:renderer-sinks
          if ($LASTEXITCODE -ne 0) { throw 'renderer sinks failed' }
          npx vitest run forge.config.test.ts scripts/build-windows-icon.test.mjs build/prune-native-payload.test.ts scripts/rebuild-node-natives.test.mjs scripts/windows-release-workflow.test.mjs src/shared/terminal-control-sequences.test.ts src/preload/functional-smoke.test.ts src/main/updater.test.ts src/main/updater-feed.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'release tests failed' }

      # Sem Authenticode desde 05/10/2026: o eSigner da SSL.com cobrava por
      # assinatura e cada build assina dezenas de arquivos. A versão assinada é
      # a da Microsoft Store, que reassina o MSIX de graça. Se a assinatura de
      # release reaparecer no ambiente do worker, o Forge voltaria a chamar o
      # eSigner: pare antes de empacotar.
      - name: Build unsigned Windows x64 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:NEXUS_WINDOWS_RELEASE_SIGNING -or $env:WINDOWS_CERTIFICATE_FILE) { throw 'Windows release must not sign through eSigner: remove NEXUS_WINDOWS_RELEASE_SIGNING and WINDOWS_CERTIFICATE_FILE from this worker' }
          if (Test-Path out) { Remove-Item out -Recurse -Force }
          npm run make -- --platform win32 --arch x64
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Hash package, run native smoke and collect immutable payload
        shell: pwsh
        run: ./scripts/collect-windows-release.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-release
          path: windows-release-assets/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-release-receipt
          path: windows-release-assets/windows-release-receipt.json
          if-no-files-found: error
          retention-days: 90
