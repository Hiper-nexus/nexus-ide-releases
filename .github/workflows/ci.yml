name: CI

on:
  # Site, API e docs não entram no app: commit que só mexe neles não gasta
  # minutos (o Actions é cobrado por minuto; o macOS custa ~10x).
  push:
    branches: [main]
    paths-ignore: &sem-app
      - 'site/**'
      - 'cloud-api/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore: *sem-app

permissions:
  contents: read

# Cancela runs sobrepostas do mesmo ref. Commits diretos na main em rajada
# disparavam runs duplicadas deste gate. cancel-in-progress mata a run
# anterior quando um novo commit chega; a proteção do gate permanece íntegra.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The monorepo's strict TypeScript graph exceeds Node's default ~2 GB
      # old-space limit on the GitHub-hosted runner.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Bootstrap repository-pinned npm with integrity verification
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';
          import { readAndAssertReleaseAuthority } from './scripts/release-authority.mjs';
          import { bootstrapPinnedNpm } from './scripts/make-release.mjs';
          const authority = readAndAssertReleaseAuthority();
          if (process.versions.node !== authority.nodeVersion || process.arch !== 'x64') throw new Error('Linux release runtime mismatch');
          const execute = (command, args, options) => {
            const result = spawnSync(command, args, { ...options, encoding: 'utf8', shell: false });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(`pinned npm bootstrap command failed: ${command}`);
            return result;
          };
          const buildBase = path.join(process.env.RUNNER_TEMP, 'nexus-linux-toolchain');
          const pinned = bootstrapPinnedNpm({
            buildBase, version: authority.npmVersion, expectedIntegrity: authority.npmPackageIntegrity,
            execute, environment: process.env,
          });
          const bin = path.join(buildBase, 'bin');
          fs.mkdirSync(bin, { recursive: true });
          fs.symlinkSync(pinned.npmCli, path.join(bin, 'npm'));
          fs.symlinkSync(path.join(path.dirname(pinned.npmCli), 'npx-cli.js'), path.join(bin, 'npx'));
          fs.appendFileSync(process.env.GITHUB_PATH, `${bin}\n`);
          for (const name of ['NPM_CONFIG_CACHE', 'NPM_CONFIG_USERCONFIG', 'NPM_CONFIG_REGISTRY']) {
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${pinned.npmEnvironment[name]}\n`);
          }
          NODE
          # GITHUB_PATH takes effect in the next step, including collector npm --version.

      - name: Install Linux sandbox provider (bubblewrap)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:main-sync
      # Só erros: as regras do plugin local nexus (oxlint-plugin-nexus) —
      # supressão sem motivo e teste registrado em laço. Warnings não reprovam aqui.
      - name: Oxlint (erros, incluindo supressão sem motivo)
        run: npm run lint:oxlint -- --quiet
      - run: npm run security:renderer-sinks
      - run: npm test
      # Tetos de trabalho determinísticos (contagem, nunca relógio); ver
      # docs/perf-budgets.md. Também rodam no npm test; aqui a falha tem nome.
      - name: Perf budgets
        run: npm run test:perf
      - name: Prove Linux command namespace lifetime
        env:
          NEXUS_LINUX_OWNED_COMMAND_TEST: "1"
        run: npx vitest run src/main/orch/owned-linux-command.test.ts --maxWorkers=1
      - name: Build isolated F-764 analysis and regex audit workers
        run: |
          npx vite build --config vite.pty-analysis.config.ts --outDir "$RUNNER_TEMP/f764-pty"
          npx vite build --config scripts/f764/vite.regex-audit.config.ts --outDir "$RUNNER_TEMP/f764-regex"
      - name: Verify bounded adversarial detection regexes
        run: node scripts/f764/regex-adversarial.cjs "$RUNNER_TEMP/f764-regex/regex-adversarial-worker.cjs" "$RUNNER_TEMP/f764-evidence/regex.json"
      - name: Measure F-764 production Main with fifteen PTYs
        env:
          F764_LOAD_MS: "30000"
          F764_WORKER_ENTRY: ${{ runner.temp }}/f764-pty/pty-analysis-worker-entry.js
          F764_ARTIFACT_DIR: ${{ runner.temp }}/f764-evidence
        run: npx vitest run src/main/pty/pty-analysis-main-load.test.ts --maxWorkers=1
      - name: Prove F-764 responsiveness and semantic recovery after poisoned analysis
        env:
          F764_LOAD_MS: "30000"
          F764_INJECT_POISON: "1"
          F764_WORKER_ENTRY: ${{ runner.temp }}/f764-pty/pty-analysis-worker-entry.js
          F764_ARTIFACT_DIR: ${{ runner.temp }}/f764-evidence/poison
        run: npx vitest run src/main/pty/pty-analysis-main-load.test.ts --maxWorkers=1
      - name: Preserve F-764 timing and CPU profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f764-main-responsiveness
          path: ${{ runner.temp }}/f764-evidence/
          if-no-files-found: error
